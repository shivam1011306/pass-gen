<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Random Password Generator</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <div class="password-box">

            <h1>🔐 Password Generator</h1>

            <p class="subtitle">
                Create a strong and random password
            </p>

            <form method="POST">

                <label for="length">
                    Password Length
                </label>

                <input
                    type="number"
                    id="length"
                    name="length"
                    min="1"
                    max="94"
                    placeholder="Enter password length"
                    required
                >

                <button type="submit">
                    Generate Password
                </button>

            </form>

            {% if password %}
                <div class="result">
                    <p>Your Generated Password:</p>

                    <div class="password">
                        {{ password }}
                    </div>
                </div>
            {% endif %}

        </div>

    </div>

</body>
</html>
